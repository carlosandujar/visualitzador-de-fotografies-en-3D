<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title> Bidirectional viewer</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            html {
                height: 100%;
                }
                body {
                margin: 0;
                height: 100%;
                }
                canvas {
                width: 100%;
                height: 100%;
                display: block;
                }
        </style>
    </head>
    <body>
         <!-- Info Modal (Hidden by Default) -->
        <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white p-6 rounded-lg shadow-lg w-96 text-center">
                <h2 class="text-xl font-semibold mb-4">Information</h2>
                <p class="text-gray-600 mb-4">Image group saved successfully!</p>
                <button id="closeModal" class="px-4 py-2 bg-red-500 text-white rounded-lg">Close</button>
            </div>
        </div>

        <!-- Text Modal (Hidden by Default) -->
        <div id="textModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white p-6 rounded-lg shadow-lg w-96 text-center">
                <h2 class="text-xl font-semibold mb-4">Create New Group</h2>

                <!-- Input Field -->
                <input type="text" id="groupName" placeholder="Enter group name"
                    class="w-full p-2 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-400 outline-none">

                <!-- Buttons -->
                <div class="flex justify-end space-x-2">
                    <button id="closeTextModal" class="px-4 py-2 bg-gray-400 text-white rounded-lg">Cancel</button>
                    <button id="saveGroup" class="px-4 py-2 bg-green-500 text-white rounded-lg">Save</button>
                </div>
            </div>
        </div>

        <!-- Info bar  -->
        <div
            id="info"
            style="
                text-align: center;
                white-space: pre; 
                height: 25px;
                background-color: rgb(70, 70, 70);
                color: aliceblue;
                font-family: 'Open Sans', sans-serif;
            "
        > Left click on an image: Open the image    |    Right click on an image: Select the image </div> <!-- Single line because of white-space:pre -->
        <script type="module" src="/main.js"></script>

        <!-- Handlers for the modal dialog-->
        <script>
            // Get modal elements
            const modal = document.getElementById("modal");
            const closeModal = document.getElementById("closeModal");
    
            // Hide modal
            closeModal.addEventListener("click", () => {
                modal.classList.add("hidden");
            });
    
            // Close modal when clicking outside
            modal.addEventListener("click", (e) => {
                if (e.target === modal) modal.classList.add("hidden");
            });
        </script>

        <!-- Handlers for the text modal dialog-->
        <script>
            // Get modal elements
            const textModal = document.getElementById("textModal");
            const closeTextModal = document.getElementById("closeTextModal");
        
            // Hide modal
            closeTextModal.addEventListener("click", () => {
                textModal.classList.add("hidden");
            });

        </script>
    </body>
</html>
